version: '3.8'

services:
  # =================================================================
  # Container 1: Relational Enterprise Database (SQL Server 2022)
  # =================================================================
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=TechMove#2026_EnterpriseSecure!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - glms-sql-data:/var/opt/mssql
    networks:
      - glms-internal-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TechMove#2026_EnterpriseSecure!' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # =================================================================
  # Container 2: Service-Oriented Web API Backend (TechMove.GLMS.API)
  # Talks directly to the SQL Server Database
  # =================================================================
  glms-backend-api:
    build:
      context: .
      dockerfile: TechMove.GLMS.API/Dockerfile
    container_name: glms-backend-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sql-server-db,1433;Database=TechMoveGLMS_Db;User Id=sa;Password=TechMove#2026_EnterpriseSecure!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - JwtSettings__SecretKey=TechMove_Enterprise_GLMS_Super_Secret_Key_2026_Secure_Token_Must_Be_Long_Enough!
      - JwtSettings__Issuer=TechMove.GLMS.API
      - JwtSettings__Audience=TechMove.GLMS.Clients
      - JwtSettings__ExpirationInMinutes=120
      - CurrencyApiSettings__BaseUrl=https://open.er-api.com/v6/latest/
    ports:
      - "5000:8080"
    depends_on:
      sql-server-db:
        condition: service_healthy
    networks:
      - glms-internal-net

  # =================================================================
  # Container 3: Decoupled MVC Frontend Web App (TechMove.GLMS.Web)
  # Zero direct SQL access; communicates with Web API via HttpClient
  # =================================================================
  glms-frontend-web:
    build:
      context: .
      dockerfile: TechMove.GLMS.Web/Dockerfile
    container_name: glms-frontend-web
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://glms-backend-api:8080
    ports:
      - "5001:8080"
    depends_on:
      - glms-backend-api
    networks:
      - glms-internal-net

# ===================================================================
# Isolated Internal Docker Bridge Network for Container DNS Resolution
# ===================================================================
networks:
  glms-internal-net:
    name: glms-internal-net
    driver: bridge

# ===================================================================
# Persistent Docker Volume for SQL Server Data Storage
# ===================================================================
volumes:
  glms-sql-data:
    name: glms-sql-data

